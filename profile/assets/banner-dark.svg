<svg xmlns="http://www.w3.org/2000/svg" width="880" height="320" viewBox="0 0 880 320" role="img" aria-label="Satelit: Moldova's data in one API"><style>.t{font:700 42px -apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif;fill:#F3F1EC;letter-spacing:-.5px}.s{font:400 18px -apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif;fill:#9AA0A8}.big{font:700 38px -apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif;fill:#F0B14E;letter-spacing:-.5px}.lbl{font:400 17px -apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif;fill:#9AA0A8}.f{opacity:0}.f0{animation:k0 18s infinite}@keyframes k0{0%,0.00%{opacity:0;transform:translateY(16px)}2.22%,14.44%{opacity:1;transform:translateY(0)}16.67%,100%{opacity:0;transform:translateY(-16px)}}.f1{animation:k1 18s infinite}@keyframes k1{0%,16.67%{opacity:0;transform:translateY(16px)}18.89%,31.11%{opacity:1;transform:translateY(0)}33.33%,100%{opacity:0;transform:translateY(-16px)}}.f2{animation:k2 18s infinite}@keyframes k2{0%,33.33%{opacity:0;transform:translateY(16px)}35.56%,47.78%{opacity:1;transform:translateY(0)}50.00%,100%{opacity:0;transform:translateY(-16px)}}.f3{animation:k3 18s infinite}@keyframes k3{0%,50.00%{opacity:0;transform:translateY(16px)}52.22%,64.44%{opacity:1;transform:translateY(0)}66.67%,100%{opacity:0;transform:translateY(-16px)}}.f4{animation:k4 18s infinite}@keyframes k4{0%,66.67%{opacity:0;transform:translateY(16px)}68.89%,81.11%{opacity:1;transform:translateY(0)}83.33%,100%{opacity:0;transform:translateY(-16px)}}.f5{animation:k5 18s infinite}@keyframes k5{0%,83.33%{opacity:0;transform:translateY(16px)}85.56%,97.78%{opacity:1;transform:translateY(0)}100.00%,100%{opacity:0;transform:translateY(-16px)}}
