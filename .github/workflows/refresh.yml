name: Refresh profile

# The profile's cards show live numbers: rebuild them from the keyless API routes a few times a day.
on:
  schedule:
    - cron: '17 5,11,17 * * *'
  workflow_dispatch:
  push:
    paths: ['scripts/**']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/build.mjs
      - name: Commit when something changed
        run: |
          git add profile
          if git diff --cached --quiet; then echo "No change"; exit 0; fi
          git -c user.name="Satelit" -c user.email="contact@satelit.md" commit -m "Profile: live numbers of $(date -u +%F)"
          git push
